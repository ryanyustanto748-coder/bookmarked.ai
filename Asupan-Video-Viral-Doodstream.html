<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Video</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .watch-button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.2em;
            color: white;
            background-color: #ff0000; /* Warna Merah khas video */
            border: none;
            border-radius: 5px;
            text-decoration: none; /* Hilangkan garis bawah pada link */
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .watch-button:hover {
            background-color: #cc0000;
        }
        .description {
            margin-top: 30px;
            padding: 15px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 klik tombol untuk melihat video</h1>

    <a href="URL_VIDEO_ANDA" class="watch-button" target="_blank">
        ▶️ WATCH VIDEO
    </a>

    <div class="description">
        <p>⚠️ **Penting:** Sebelum video diputar, Anda mungkin akan diarahkan untuk **melewati beberapa iklan** terlebih dahulu.</p>
        <p>Ikuti petunjuk pada halaman baru untuk melanjutkan ke konten utama.</p>
    </div>
</div>

</body>
</html>
